 <!DOCTYPE html>
<html>
<head>
    <title>Booking Form Challenge</title>

    <style>
        body {
            background-color: #101d32;
            font-family: Arial, sans-serif;
            color: white;
            margin: 0;
            padding: 30px;
        }

        .container {
            background-color: #172842;
            border: 2px solid #bd704b;
            border-radius: 15px;
            width: 550px;
            margin: 20px auto;
            padding: 30px;
        }

        h1 {
            color: #d47b50;
            text-align: center;
            font-size: 32px;
        }

        p {
            text-align: center;
            color: #c6d0df;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #71819a;
            border-radius: 6px;
            background-color: #101d32;
            color: white;
            box-sizing: border-box;
            font-size: 15px;
        }

        input::placeholder,
        textarea::placeholder {
            color: #aab6c8;
        }

        .radio-group {
            margin-top: 12px;
        }

        .radio-group label {
            display: inline-block;
            margin-right: 15px;
            font-weight: normal;
        }

        .radio-group input {
            width: auto;
        }

        .checkbox {
            margin-top: 20px;
        }

        .checkbox label {
            display: inline;
            font-weight: normal;
        }

        .checkbox input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background-color: #c66d45;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #df8054;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>Booking Form</h1>

    <p>Complete the form to book your trip</p>

    <form>

        <!-- Full Name -->
        <label for="fullname">Full Name</label>

        <input type="text"
               id="fullname"
               name="fullname"
               placeholder="Enter your full name"
               required>


        <!-- Email -->
        <label for="email">Email</label>

        <input type="email"
               id="email"
               name="email"
               placeholder="Enter your email"
               required>


        <!-- Phone Number -->
        <label for="phone">Phone Number</label>

        <input type="tel"
               id="phone"
               name="phone"
               placeholder="Enter your phone number"
               required>


        <!-- Destination -->
        <label for="destination">Destination Selection</label>

        <select id="destination"
                name="destination"
                required>

            <option value="">Select Destination</option>
            <option value="Paris">Paris</option>
            <option value="London">London</option>
            <option value="Dubai">Dubai</option>
            <option value="Rome">Rome</option>
            <option value="Turkey">Turkey</option>

        </select>


        <!-- Travel Date -->
        <label for="date">Travel Date</label>

        <input type="date"
               id="date"
               name="date"
               required>


        <!-- Number of Travelers -->
        <label for="travelers">Number of Travelers</label>

        <input type="number"
               id="travelers"
               name="travelers"
               min="1"
               placeholder="Enter number of travelers"
               required>


        <!-- Radio Buttons -->
        <label>Travel Type</label>

        <div class="radio-group">

            <label>
                <input type="radio"
                       name="travelType"
                       value="Solo"
                       required>
                Solo
            </label>

            <label>
                <input type="radio"
                       name="travelType"
                       value="Family">
                Family
            </label>

            <label>
                <input type="radio"
                       name="travelType"
                       value="Business">
                Business
            </label>

        </div>


        <!-- Additional Notes -->
        <label for="notes">Additional Notes</label>

        <textarea id="notes"
                  name="notes"
                  rows="4"
                  placeholder="Write your additional notes here..."></textarea>


        <!-- Checkbox -->
        <div class="checkbox">

            <input type="checkbox"
                   id="terms"
                   name="terms"
                   required>

            <label for="terms">
                I accept the terms and conditions
            </label>

        </div>


        <!-- Submit Button -->
        <button type="submit">
            SUBMIT
        </button>

    </form>

</div>

</body>
</html>
