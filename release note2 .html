 <!DOCTYPE html>
<html>
<head>
    <title>Styling text</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 8px;
        }

        h1 {
            color: orange;
            font-size: 56px;
            margin-top: 45px;
            margin-left: 12px;
        }

        h2 {
            text-align: right;
            font-size: 58px;
            margin-top: 50px;
            margin-right: 10px;
        }

        p {
            font-size: 40px;
            margin-left: 12px;
        }

        .second {
            text-align: right;
            font-family: "Courier New", monospace;
            color: gray;
            margin-top: 40px;
            margin-right: 12px;
        }

    </style>
</head>

<body>

    <h1>Styling text</h1>

    <h2>Heading Num. 2</h2>

    <p>My first paragraph.</p>

    <p class="second">
        My second paragraph.
    </p>

</body>
</html>
